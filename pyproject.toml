[tool.poetry]
name = "tom-regions"
version = "0.1.0"
description = "A TOMToolkit application."
authors = ["TOMToolkit Team <tomtoolit-maintiners@lco.global>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
tomtoolkit = ">=2.32"
# PostgreSQL driver. tom_regions requires PostgreSQL >= 14 for int8range,
# int8multirange, and range_agg.
psycopg2-binary = ">=2.9"
# Multi-Order Coverage (MOC) operations. Pulls in cdshealpix transitively
# for fast HEALPix conversions; we don't need healpy.
mocpy = ">=0.16,<0.20"

[tool.poetry.group.dev.dependencies]
factory-boy = ">=3.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
