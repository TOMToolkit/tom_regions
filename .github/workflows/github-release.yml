# From TOMToolkit/tom_app_template, adapted for tom_regions: the release-
# gate test job needs the postgres service (see run-tests.yml for why) and
# is Linux-only for the same reason. ``create_release`` additionally gets a
# ``needs: run_tests`` gate so a draft release can't be cut from a red tag.

name: Create Github Release

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-alpha.*"

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tom_regions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=2.0,<3.0"
          poetry env info  # display poetry's env info for debugging
          poetry install --with test
      - name: Run Tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tom_regions_test
        run: poetry run python tom_regions/tests/run_tests.py

  create_release:
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
    - uses: actions/checkout@v4
    - uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: tom-regions ${{ github.ref }}
        draft: true
