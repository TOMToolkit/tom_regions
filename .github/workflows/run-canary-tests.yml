# From TOMToolkit/tom_app_template, adapted for tom_regions (postgres
# service -- see run-tests.yml for why). The suite currently has no
# ``@tag('canary')`` tests, so this run is a fast no-op; it exists so the
# harness is in place when Layer 1 adds live GraceDB-fetch tests.

name: run-canary-tests
on:
  schedule:
    - cron: '0 8 * * *'
jobs:
  canary_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tom_regions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "poetry>=2.0,<3.0"
        poetry env info  # display poetry's env info for debugging
        poetry install --with test
    - name: Run Canary Tests
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: '5432'
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: tom_regions_test
      run: poetry run python tom_regions/tests/run_canary_tests.py
